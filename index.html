<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Abastecimentos da moto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73;
  --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12);
  --accent:#0071E3; --btn:#0071E3; --orange:#FF9500; --good:#248A3D; --bad:#D70015;
  --toast:rgba(29,29,31,.92);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#98989D;
    --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24);
    --accent:#4DA3FF; --orange:#FF9F0A; --good:#30D158; --bad:#FF6961;
    --toast:rgba(58,58,60,.95);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
main{max-width:1000px;margin:0 auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{margin:0;letter-spacing:-.022em}
h1{font-size:34px;line-height:1.1;font-weight:700}
h2{font-size:22px;font-weight:600;margin:0 0 12px 4px}
h3{font-size:17px;font-weight:600}
@media (min-width:720px){ main{padding-top:calc(56px + env(safe-area-inset-top,0px))} h1{font-size:44px} }

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
section{margin-top:40px}
.top{margin-top:0}

.card{background:var(--card);border-radius:18px;box-shadow:0 0 0 .5px var(--sep)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* botões */
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{display:block;width:100%;height:50px;border:0;border-radius:14px;font-weight:600;font-size:17px;transition:opacity .15s,transform .15s}
.btn.primary{background:var(--btn);color:#fff}
.btn.secondary{background:var(--fill);color:var(--accent)}
.btn:active{transform:scale(.98);opacity:.85}
.text{background:none;border:0;padding:6px 4px;color:var(--accent);font-size:17px}
.text:active{opacity:.6}
.del{background:none;border:0;padding:8px;margin:-8px -8px -8px 0;color:var(--bad);font-size:15px}
.del:active{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* formulários estilo lista agrupada */
.list{padding-top:4px}
.item{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px;
  margin-left:16px;padding:8px 16px 8px 0;border-bottom:.5px solid var(--sep)}
.item:last-child{border-bottom:0}
.item span{white-space:nowrap}
.item input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;text-align:right;padding:6px 0;-moz-appearance:textfield;appearance:none}
.item input::placeholder{color:var(--muted);opacity:1}
.item input::-webkit-inner-spin-button,.item input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.card form,form.card{padding-bottom:16px}
form .btn{width:calc(100% - 32px);margin:12px 16px 0}
.err{margin:0;padding:10px 16px 0;color:var(--bad);font-size:14px}
.err:empty{display:none}
.login{max-width:420px;margin:8px auto 0;padding-top:20px}
.login h2{margin:0 16px 8px}

/* topo */
.top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:stretch}
@media (max-width:760px){ .top{grid-template-columns:1fr} }
.gauge{display:flex;align-items:center;justify-content:center;padding:20px 16px}
.gauge svg{width:100%;max-width:340px;height:auto;display:block}
.g-track{fill:none;stroke:var(--fill);stroke-width:12;stroke-linecap:round}
.g-val{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round}
.g-avg{stroke:var(--orange);stroke-width:3;stroke-linecap:round}
.g-num{font:600 40px -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;fill:var(--ink);letter-spacing:-.02em}
.g-lbl{font:400 11px -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;fill:var(--muted)}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
.kpi{padding:16px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;margin-top:4px;font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.02em;white-space:nowrap}

/* mês */
.chart{padding:16px 12px 12px;margin-bottom:12px}
.ct{padding:0 6px 12px}
.bars{display:flex;align-items:stretch;gap:8px;height:180px}
.b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.bw{position:relative;flex:1;width:100%}
.bw i{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,44px);border-radius:8px 8px 4px 4px;background:var(--accent);opacity:.3}
.b.last .bw i{opacity:1}
.bv{font-size:13px;font-weight:600}
.bl{font-size:12px;color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mcard{padding:18px}
.mcard header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.big{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:15px;font-weight:400;color:var(--muted);margin-left:4px;letter-spacing:0}
.mcard dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:16px 0 0}
.mcard dt{font-size:13px;color:var(--muted)}
.mcard dd{margin:0;font-weight:500}
.deltas{list-style:none;margin:16px 0 0;padding:12px 0 0;border-top:.5px solid var(--sep)}
.deltas li{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:2px 0}
.deltas span{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* histórico */
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.row:last-child{border-bottom:0}
.r-main{flex:1;min-width:0}
.r-main b,.r-side b{display:block;font-weight:600;font-size:16px;white-space:nowrap}
.r-side{text-align:right}
.meta{display:flex;flex-wrap:wrap;gap:0 12px;font-size:14px;color:var(--muted)}
.r-side .meta{justify-content:flex-end}

/* dados */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px}

/* aviso */
#status{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  max-width:calc(100% - 32px);padding:12px 20px;border-radius:999px;background:var(--toast);color:#fff;font-size:15px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:20;text-align:center}
#status:empty{display:none}
#status.err{background:#D70015}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main>
  <header class="head">
    <h1>Abastecimentos</h1>
    <button id="out" class="text" hidden>Sair</button>
  </header>

  <form id="login" class="card login" hidden>
    <h2>Entrar</h2>
    <div class="list">
      <label class="item"><span>E-mail</span><input type="email" id="email" autocomplete="username" placeholder="email@exemplo.com" required></label>
      <label class="item"><span>Senha</span><input type="password" id="pass" autocomplete="current-password" placeholder="Senha" required></label>
    </div>
    <p id="lerr" class="err" role="alert"></p>
    <button class="btn primary" type="submit">Entrar</button>
  </form>

  <div id="app" hidden>
    <section class="top">
      <form id="f" class="card" novalidate>
        <div class="list">
          <label class="item"><span>Data e hora</span><input type="datetime-local" id="dt" required></label>
          <label class="item"><span>Quilometragem</span><input type="number" id="km" inputmode="numeric" step="1" min="0" placeholder="km" required></label>
          <label class="item"><span>Litros</span><input type="number" id="l" inputmode="decimal" step="0.01" min="0" placeholder="litros" required></label>
          <label class="item"><span>Valor pago</span><input type="number" id="v" inputmode="decimal" step="0.01" min="0" placeholder="R$" required></label>
        </div>
        <p id="err" class="err" role="alert"></p>
        <button class="btn primary" type="submit">Lançar abastecimento</button>
      </form>
      <div class="card gauge" id="gauge"></div>
    </section>

    <section>
      <div class="kpis" id="kpis"></div>
    </section>

    <section>
      <h2>Por mês</h2>
      <div class="card chart" id="chart" hidden></div>
      <div class="months" id="monthly"></div>
    </section>

    <section>
      <h2>Histórico</h2>
      <div class="card" id="history"></div>
    </section>

    <section>
      <h2>Dados</h2>
      <div class="actions">
        <button id="exp" class="btn secondary">Baixar CSV</button>
        <button id="imp" class="btn secondary">Importar CSV</button>
        <input type="file" id="file" accept=".csv,text/csv" hidden>
      </div>
    </section>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function(){
  // Preencha com os dados do seu projeto no Supabase (a chave publicável pode ficar no código).
  var SUPABASE_URL = 'https://xdoywqekvfmxujuxgvfw.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_ruC2CarzvaaXcVdZ9TFnwA_bxvSVlDI';
  var LOCAL_KEY = 'moto.abastecimentos.v1';
  var sb = null, rows = [];

  var $ = function(id){ return document.getElementById(id); };
  var nf = function(d){ return new Intl.NumberFormat('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); };
  var n0 = nf(0), n1 = nf(1), n2 = nf(2);
  var brl = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
  var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };

  /* ---------- dados ---------- */
  function sortRows(){ rows.sort(function(a,b){ return a.dt < b.dt ? -1 : a.dt > b.dt ? 1 : a.km - b.km; }); }
  function fromDb(r){
    var d = new Date(r.data_hora); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return { id:r.id, dt:d.toISOString().slice(0,16), km:Number(r.quilometragem_atual), l:Number(r.litros_abastecidos), v:Number(r.valor_pago) };
  }
  function toDb(r){
    return { data_hora:new Date(r.dt).toISOString(), quilometragem_atual:r.km, litros_abastecidos:r.l, valor_pago:r.v };
  }

  /* ---------- CSV ---------- */
  var HEADER = 'data_hora,quilometragem_atual,litros_abastecidos,valor_pago';
  function toCSV(){
    return HEADER + '\n' + rows.map(function(r){ return [r.dt, r.km, r.l, r.v].join(','); }).join('\n') + '\n';
  }
  function fromCSV(text){
    var out = [];
    text.replace(/^\uFEFF/,'').split(/\r?\n/).forEach(function(line){
      line = line.trim();
      if(!line || line.indexOf('data_hora') === 0) return;
      var p = line.split(/[,;]/);
      if(p.length < 4) return;
      var km = parseFloat(p[1]), l = parseFloat(p[2]), v = parseFloat(p[3]);
      if(!p[0] || isNaN(km) || isNaN(l) || isNaN(v)) return;
      out.push({ dt:p[0].trim(), km:km, l:l, v:v });
    });
    return out;
  }

  /* ---------- cálculos ---------- */
  // Método do tanque cheio: o trecho entre dois abastecimentos usa os litros do abastecimento mais recente.
  function compute(){
    var res = rows.map(function(r,i){
      var o = { dt:r.dt, km:r.km, l:r.l, v:r.v, ppl:r.v / r.l, dist:null, kml:null, cpk:null };
      if(i > 0){
        var d = r.km - rows[i-1].km;
        if(d > 0 && r.l > 0){ o.dist = d; o.kml = d / r.l; o.cpk = r.v / d; }
      }
      return o;
    });
    return res;
  }
  function monthly(list){
    var m = {};
    list.forEach(function(o){
      if(o.dist == null) return;
      var k = o.dt.slice(0,7);
      var x = m[k] || (m[k] = { k:k, dist:0, l:0, v:0 });
      x.dist += o.dist; x.l += o.l; x.v += o.v;
    });
    var keys = Object.keys(m).sort();
    var td = 0, tl = 0;
    keys.forEach(function(k){ td += m[k].dist; tl += m[k].l; });
    var avg = tl ? td / tl : null;
    var prev = null;
    return keys.map(function(k){
      var x = m[k];
      x.kml = x.dist / x.l; x.cpk = x.v / x.dist; x.ppl = x.v / x.l;
      x.vsPrev = prev ? (prev.cpk - x.cpk) * x.dist : null;
      x.vsAvg = avg != null ? x.kml - avg : null;
      prev = x;
      return x;
    });
  }

  /* ---------- render ---------- */
  function fmtDate(dt){
    var d = new Date(dt);
    return isNaN(d) ? esc(dt) : d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(', ',' ');
  }
  function fmtMonthLong(k){
    var t = new Date(k + '-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function delta(v, f){
    if(v == null) return '<b>—</b>';
    return '<b class="' + (v >= 0 ? 'pos' : 'neg') + '">' + (v >= 0 ? '+' : '−') + f(Math.abs(v)) + '</b>';
  }

  function renderGauge(list, tot){
    var last = null;
    for(var i = list.length - 1; i >= 0; i--){ if(list[i].kml != null){ last = list[i].kml; break; } }
    var MAX = 60, cx = 120, cy = 118, r = 96;
    function pt(f, rad){ var t = Math.PI * (1 - Math.min(Math.max(f,0),1)); return [cx + rad*Math.cos(t), cy - rad*Math.sin(t)]; }
    var s = '<svg viewBox="0 0 240 160" role="img" aria-label="Eficiência do último abastecimento">';
    s += '<path class="g-track" d="M24 118 A96 96 0 0 1 216 118"/>';
    if(last != null){
      var e = pt(last / MAX, r);
      s += '<path class="g-val" d="M24 118 A96 96 0 0 1 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2) + '"/>';
    }
    if(tot.kml != null){
      var a = pt(tot.kml / MAX, r - 12), b = pt(tot.kml / MAX, r + 12);
      s += '<line class="g-avg" x1="' + a[0].toFixed(2) + '" y1="' + a[1].toFixed(2) + '" x2="' + b[0].toFixed(2) + '" y2="' + b[1].toFixed(2) + '"/>';
    }
    s += '<text class="g-num" x="120" y="108" text-anchor="middle">' + (last != null ? n1.format(last) : '—') + '</text>';
    s += '<text class="g-lbl" x="120" y="136" text-anchor="middle">km/l no último abastecimento</text>';
    s += '<text class="g-lbl" x="120" y="154" text-anchor="middle">média ' + (tot.kml != null ? n1.format(tot.kml) + ' km/l' : '—') + '</text>';
    s += '</svg>';
    $('gauge').innerHTML = s;
  }

  function renderKpis(tot){
    var items = [
      [tot.kml != null ? n1.format(tot.kml) + ' km/l' : '—', 'Consumo médio'],
      [tot.cpk != null ? brl.format(tot.cpk) : '—', 'Custo por km'],
      [tot.ppl != null ? brl.format(tot.ppl) : '—', 'Preço médio por litro'],
      [n0.format(tot.dist) + ' km', 'Distância rodada'],
      [n1.format(tot.l) + ' L', 'Combustível'],
      [brl.format(tot.v), 'Gasto total']
    ];
    $('kpis').innerHTML = items.map(function(i){ return '<div class="card kpi"><span>' + i[1] + '</span><b>' + i[0] + '</b></div>'; }).join('');
  }

  function renderMonthly(ms){
    if(!ms.length){
      $('monthly').innerHTML = '<div class="card empty">Sem dados suficientes. São necessários ao menos 2 abastecimentos.</div>';
      $('chart').hidden = true; return;
    }
    var kmlF = function(x){ return n1.format(x) + ' km/l'; }, brlF = function(x){ return brl.format(x); };
    $('monthly').innerHTML = ms.slice().reverse().map(function(m){
      return '<article class="card mcard"><header><h3>' + fmtMonthLong(m.k) + '</h3><div class="big">' + n1.format(m.kml) + '<small>km/l</small></div></header>' +
        '<dl><div><dt>Distância</dt><dd>' + n0.format(m.dist) + ' km</dd></div>' +
        '<div><dt>Gasto</dt><dd>' + brl.format(m.v) + '</dd></div>' +
        '<div><dt>Litros</dt><dd>' + n1.format(m.l) + ' L</dd></div>' +
        '<div><dt>Custo por km</dt><dd>' + brl.format(m.cpk) + '</dd></div></dl>' +
        '<ul class="deltas"><li><span>km/l vs. média</span>' + delta(m.vsAvg, kmlF) + '</li>' +
        '<li><span>R$ vs. mês anterior</span>' + delta(m.vsPrev, brlF) + '</li></ul></article>';
    }).join('');

    var data = ms.slice(-12);
    var max = Math.max.apply(null, data.map(function(d){ return d.kml; }));
    $('chart').innerHTML = '<h3 class="ct">km/l por mês</h3><div class="bars">' + data.map(function(d,i){
      var pct = Math.max(3, d.kml / max * 100).toFixed(1);
      return '<div class="b' + (i === data.length - 1 ? ' last' : '') + '"><span class="bv">' + n1.format(d.kml) + '</span><div class="bw"><i style="height:' + pct + '%"></i></div><span class="bl">' + d.k.slice(5,7) + '/' + d.k.slice(2,4) + '</span></div>';
    }).join('') + '</div>';
    $('chart').hidden = false;
  }

  function renderHistory(list){
    if(!list.length){ $('history').innerHTML = '<div class="empty">Nenhum abastecimento lançado.</div>'; return; }
    var h = '';
    for(var i = list.length - 1; i >= 0; i--){
      var o = list[i];
      h += '<div class="row"><div class="r-main"><b>' + fmtDate(o.dt) + '</b><div class="meta"><span>' + n0.format(o.km) + ' km</span><span>' + n2.format(o.l) + ' L</span><span>' + brl.format(o.v) + '</span></div></div>' +
           '<div class="r-side"><b>' + (o.kml != null ? n1.format(o.kml) + ' km/l' : '—') + '</b><div class="meta">' + (o.dist != null ? '<span>' + n0.format(o.dist) + ' km</span>' : '') + '<span>' + brl.format(o.ppl) + '/L</span></div></div>' +
           '<button class="del" data-del="' + i + '" aria-label="Excluir lançamento">Excluir</button></div>';
    }
    $('history').innerHTML = h;
  }

  function render(){
    var list = compute(), ms = monthly(list);
    var tot = { dist:0, l:0, v:0, kml:null, cpk:null, ppl:null };
    list.forEach(function(o){ if(o.dist != null){ tot.dist += o.dist; tot.l += o.l; tot.v += o.v; } });
    if(tot.dist > 0){ tot.kml = tot.dist / tot.l; tot.cpk = tot.v / tot.dist; tot.ppl = tot.v / tot.l; }
    renderGauge(list, tot); renderKpis(tot); renderMonthly(ms); renderHistory(list);
    $('km').placeholder = rows.length ? 'acima de ' + n0.format(rows[rows.length-1].km) : '';
  }

  /* ---------- status ---------- */
  var tm;
  function status(msg, isErr){
    var el = $('status'); el.textContent = msg; el.className = isErr ? 'err' : '';
    clearTimeout(tm); if(msg) tm = setTimeout(function(){ el.textContent = ''; }, 6000);
  }

  /* ---------- Supabase ---------- */
  function showApp(on){ $('login').hidden = on; $('app').hidden = !on; $('out').hidden = !on; }

  async function load(){
    var res = await sb.from('abastecimentos').select('id,data_hora,quilometragem_atual,litros_abastecidos,valor_pago').order('data_hora', { ascending:true });
    if(res.error){ status('Falha ao carregar: ' + res.error.message, true); return; }
    rows = res.data.map(fromDb); sortRows(); render();
  }

  async function migrateLocal(){
    var local; try{ local = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); }catch(e){ local = []; }
    if(!local.length || rows.length) return;
    if(!confirm('Enviar os ' + local.length + ' lançamentos salvos neste navegador para o Supabase?')) return;
    var r = await sb.from('abastecimentos').insert(local.map(toDb));
    if(r.error){ status('Falha ao enviar: ' + r.error.message, true); return; }
    try{ localStorage.removeItem(LOCAL_KEY); }catch(e){}
    await load(); status(local.length + ' lançamentos enviados.');
  }

  async function start(){
    var s = await sb.auth.getSession();
    if(s.data.session){ showApp(true); await load(); await migrateLocal(); } else { showApp(false); }
  }

  /* ---------- eventos ---------- */
  function nowLocal(){
    var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,16);
  }

  $('login').addEventListener('submit', async function(ev){
    ev.preventDefault();
    var r = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('pass').value });
    if(r.error){ $('lerr').textContent = 'E-mail ou senha incorretos.'; return; }
    $('lerr').textContent = ''; $('pass').value = ''; start();
  });

  $('out').addEventListener('click', async function(){
    await sb.auth.signOut(); rows = []; render(); showApp(false);
  });

  $('f').addEventListener('submit', async function(ev){
    ev.preventDefault();
    var dt = $('dt').value, km = parseFloat($('km').value), l = parseFloat($('l').value), v = parseFloat($('v').value);
    var err = $('err'); err.textContent = '';
    if(!dt || isNaN(km) || isNaN(l) || isNaN(v) || l <= 0 || v <= 0 || km < 0){ err.textContent = 'Preencha todos os campos com valores válidos.'; return; }
    var prev = null, next = null;
    rows.forEach(function(r){ if(r.dt <= dt) prev = r; else if(!next) next = r; });
    if(prev && km <= prev.km){ err.textContent = 'A quilometragem deve ser maior que ' + n0.format(prev.km) + ' km.'; return; }
    if(next && km >= next.km){ err.textContent = 'A quilometragem deve ser menor que ' + n0.format(next.km) + ' km.'; return; }
    var ins = await sb.from('abastecimentos').insert(toDb({ dt:dt, km:km, l:l, v:v })).select().single();
    if(ins.error){ err.textContent = 'Falha ao salvar: ' + ins.error.message; return; }
    rows.push(fromDb(ins.data)); sortRows(); render();
    $('km').value = ''; $('l').value = ''; $('v').value = ''; $('dt').value = nowLocal();
    status('Abastecimento lançado.');
  });

  $('history').addEventListener('click', async function(ev){
    var b = ev.target.closest('[data-del]'); if(!b) return;
    var i = parseInt(b.getAttribute('data-del'), 10), row = rows[i];
    if(!row || !confirm('Excluir este lançamento?')) return;
    var d = await sb.from('abastecimentos').delete().eq('id', row.id);
    if(d.error){ status('Falha ao excluir: ' + d.error.message, true); return; }
    rows.splice(i, 1); render();
  });

  $('exp').addEventListener('click', function(){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([toCSV()], { type:'text/csv;charset=utf-8' }));
    a.download = 'abastecimentos.csv'; document.body.appendChild(a); a.click(); a.remove();
  });
  $('imp').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', function(ev){
    var f = ev.target.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = async function(){
      var data = fromCSV(String(rd.result));
      if(!data.length){ status('CSV inválido ou vazio.', true); return; }
      if(!confirm('Adicionar ' + data.length + ' lançamentos do arquivo ao Supabase?')) return;
      var r = await sb.from('abastecimentos').insert(data.map(toDb));
      if(r.error){ status('Falha ao importar: ' + r.error.message, true); return; }
      await load(); status(data.length + ' lançamentos importados.');
    };
    rd.readAsText(f); ev.target.value = '';
  });

  /* ---------- init ---------- */
  $('dt').value = nowLocal();
  render();
  if(!window.supabase || SUPABASE_URL.indexOf('SEU-PROJETO') > -1){
    showApp(false); $('lerr').textContent = 'Preencha SUPABASE_URL e SUPABASE_KEY no início do script do index.html.';
  } else {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    sb.auth.onAuthStateChange(function(ev){ if(ev === 'SIGNED_OUT'){ rows = []; showApp(false); } });
    start();
  }
})();
</script>
</body>
</html>
